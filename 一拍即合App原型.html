<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一拍即合（ShutterMatch）App 原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23B0540E'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23F8F5F0' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23F8F5F0'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#241D16; --paper:#F7F3EE; --card:#FFFFFF; --accent:#B0540E;
  --accent-2:#8C430C; --tint:#F4E7D5; --muted:#8A7E71; --line:#E7E0D5;
  --ok:#2F7D4F; --bad:#B03A2E; --shadow:0 6px 20px rgba(36,29,22,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:#1d1a17; color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:22px 16px 40px;
}
.ribbon{color:#B9AE9F; font-size:12px; letter-spacing:.12em; margin-bottom:14px; text-align:center}
.ribbon b{color:#E8D9C2; font-weight:600}
.toggle{display:inline-flex; background:#000; border:1px solid #3a322a; border-radius:20px; overflow:hidden; margin-bottom:16px}
.toggle button{background:transparent; color:#8f857a; border:0; padding:12px 20px; font-size:13px; cursor:pointer; transition:.2s; min-height:44px}
.toggle button.on{background:var(--accent); color:#fff}

/* 手机框架 */
.phone{
  width:392px; max-width:96vw; background:var(--paper); border-radius:34px; overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.45); position:relative; border:6px solid #000;
}
.statusbar{display:flex; justify-content:space-between; align-items:center; padding:12px 22px 8px; color:var(--ink); font-size:12px; font-weight:600; background:var(--paper)}
.screen{min-height:640px; height:680px; overflow:hidden; position:relative}
.view{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--paper); display:none; padding-bottom:80px}
.view.active{display:block}
::-webkit-scrollbar{width:0;height:0}

/* 通用组件 */
.topbar{position:sticky; top:0; z-index:5; background:rgba(247,243,238,.92); backdrop-filter:blur(8px); padding:8px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line)}
.topbar .tt{font-size:16px; font-weight:700}
.topbar .back{font-size:15px; background:var(--card); border:1px solid var(--line); width:32px;height:32px;border-radius:10px; display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink)}
.topbar .sub{font-size:12px; color:var(--muted); font-weight:400; margin-left:auto}

/* 底部导航 */
.tabbar{position:absolute; left:0; right:0; bottom:0; height:64px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:8}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--muted); cursor:pointer; border:0; background:none}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--accent); font-weight:600}
.tab.on .ic{color:var(--accent)}

.btn{display:block; width:100%; border:0; border-radius:14px; padding:15px; font-size:15px; font-weight:600; cursor:pointer; text-align:center}
.btn.primary{background:var(--accent); color:#fff}
.btn.ghost{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn.ghost.on{border-color:var(--accent); color:var(--accent); background:var(--tint)}
.btn:active{opacity:.85}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 16px 12px}
.tag{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--tint); color:var(--accent-2); font-weight:600}
.tag.green{background:#E7F2EA; color:var(--ok)}
.tag.gray{background:#EFEAE3; color:var(--muted)}
.muted{color:var(--muted)}
.price{color:var(--accent); font-weight:700}
.sec-title{font-size:15px; font-weight:700; margin:16px 16px 10px; display:flex; align-items:center; gap:6px}
.sec-title .more{margin-left:auto; font-size:12px; color:var(--muted); font-weight:400}
.hairline{height:1px; background:var(--line); margin:10px 0}

/* 首页 */
.hero{position:relative; height:190px; overflow:hidden}
.hero img{width:100%; height:100%; object-fit:cover; object-position:center}
.hero .shade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,15,10,.1),rgba(20,15,10,.72))}
.hero .htext{position:absolute; left:18px; right:18px; bottom:16px; color:#fff}
.hero .htext .h1{font-size:22px; font-weight:800; letter-spacing:.02em}
.hero .htext .h2{font-size:13px; opacity:.9; margin-top:4px}
.quick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 16px 0}
.quick .q{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center; cursor:pointer; font-size:12px}
.quick .q .qic{width:34px;height:34px; margin:0 auto 6px; border-radius:10px; display:flex;align-items:center;justify-content:center; background:var(--tint); color:var(--accent-2); font-size:17px}

/* 作品瀑布 */
.works{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
.witem{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer}
.witem img{width:100%; height:200px; object-fit:cover; display:block}
.witem .wi{ padding:9px 10px; font-size:12px}
.witem .wi .p{font-size:14px; font-weight:700; margin-top:3px}
.witem .wi .m{color:var(--muted); font-size:11px}

/* 摄影师卡片 */
.phcard{display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; margin:0 16px 10px; cursor:pointer}
.phcard .av{width:52px;height:52px;border-radius:50%;object-fit:cover; flex-shrink:0}
.phcard .inf{flex:1; min-width:0}
.phcard .nm{font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px}
.phcard .nm .cert{color:var(--ok); font-size:12px}
.phcard .dt{font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.phcard .rt{font-size:12px; color:var(--accent-2); font-weight:600}

/* 筛选 */
.chips{display:flex; gap:8px; padding:12px 16px; overflow-x:auto; white-space:nowrap}
.chip{font-size:12px; padding:7px 14px; border-radius:20px; background:#fff; border:1px solid var(--line); cursor:pointer; color:var(--ink)}
.chip.on{background:var(--accent); color:#fff; border-color:var(--accent)}

/* 摄影师详情 */
.phhead{background:#fff; padding:16px}
.phhead .row{display:flex; gap:14px; align-items:center}
.phhead .av{width:68px;height:68px;border-radius:50%;object-fit:cover}
.phhead .nm{font-size:19px; font-weight:800; display:flex; align-items:center; gap:6px}
.phhead .stat{display:flex; gap:16px; margin-top:10px}
.phhead .stat .s{font-size:12px; color:var(--muted); text-align:center}
.phhead .stat .s b{display:block; color:var(--ink); font-size:16px}
.story{font-size:13px; color:#5f5549; line-height:1.7}
.pkg{border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:9px; background:#fff; cursor:pointer; display:flex; align-items:center}
.pkg .pa{flex:1}
.pkg .pa .pn{font-weight:700; font-size:14px}
.pkg .pa .pd{font-size:12px; color:var(--muted); margin-top:3px}
.rating{color:var(--accent-2); font-weight:700}

/* 下单 */
.field{background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px; margin:0 16px 12px}
.field .fl{font-size:12px; color:var(--muted); margin-bottom:6px}
.field .fv{font-size:15px; font-weight:600}
.row2{display:flex; gap:12px}
.row2 .field{flex:1; margin:0}
.daychip{display:inline-block; padding:6px 12px; border:1px solid var(--line); border-radius:10px; margin:0 6px 6px 0; font-size:12px; cursor:pointer; background:#fff}
.daychip.on{border-color:var(--accent); color:var(--accent); background:var(--tint)}

/* 订单 */
.otabs{display:flex; padding:12px 16px 0; gap:4px; position:sticky; top:0; background:var(--paper); z-index:4}
.otab{font-size:13px; padding:8px 2px; flex:1; text-align:center; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer}
.otab.on{color:var(--accent); font-weight:700; border-color:var(--accent)}
.ocard{display:flex; gap:12px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; margin:0 16px 10px; align-items:center}
.ocard img{width:60px;height:60px;border-radius:12px;object-fit:cover}
.ocard .oi{flex:1; min-width:0}
.ocard .on{font-weight:700; font-size:14px}
.ocard .os{font-size:12px; color:var(--muted); margin-top:3px}
.ocard .ob{font-size:12px; margin-top:6px; color:var(--accent-2); font-weight:600}

/* IM */
.chat{background:var(--paper); padding:14px 14px 10px; display:flex; flex-direction:column; gap:12px; min-height:430px}
.bub{max-width:76%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.5}
.bub.them{background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px}
.bub.me{background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px}
.chatinput{display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid var(--line); align-items:center; position:sticky; bottom:0}
.chatinput input{flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 14px; font-size:14px; outline:none}

/* 我的 */
.mecard{display:flex; gap:14px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 16px 12px}
.mecard .av{width:60px;height:60px;border-radius:50%;object-fit:cover}
.mecard .nm{font-weight:800; font-size:17px}
.mecard .tg{font-size:12px; color:var(--muted); margin-top:3px}
.mrow{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 16px 10px; cursor:pointer}
.mrow .mic{width:34px;height:34px;border-radius:10px;background:var(--tint); color:var(--accent-2); display:flex;align-items:center;justify-content:center; font-size:16px}
.mrow .mn{flex:1; font-size:14px; font-weight:600}
.mrow .ma{color:var(--muted); font-size:13px}

/* 摄影师工作台 */
.dash{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
.dash .db{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px}
.dash .db .dv{font-size:22px; font-weight:800}
.dash .db .dl{font-size:12px; color:var(--muted); margin-top:3px}
.verify{background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 16px 12px; display:flex; align-items:center; gap:12px}
.verify .vc{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:18px}

/* 表格类明细 */
.rowline{display:flex; justify-content:space-between; padding:7px 0; font-size:13px}
.rowline .k{color:var(--muted)}
.bar{height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin:5px 0}
.bar i{display:block; height:100%; background:var(--accent)}

.toast{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(36,29,22,.92); color:#fff; padding:13px 20px; border-radius:12px; font-size:14px; z-index:50; opacity:0; transition:.25s; pointer-events:none; max-width:80%; text-align:center}
.toast.show{opacity:1}

@media (max-width:460px){
  body{padding:8px 0 0; background:var(--paper)}
  .ribbon,.toggle{display:none}
  .phone{width:100vw; max-width:100vw; border-radius:0; border:0; box-shadow:none}
  .screen{height:calc(100vh - 34px)}
}
</style>
</head>
<body>
<div class="ribbon">拍 一 即 合 · ShutterMatch — <b>摄影师接单赚钱 × 用户找摄影师</b></div>
<div class="toggle" id="roleToggle">
  <button data-role="user" class="on" onclick="setRole('user')">用户端 · 找摄影师</button>
  <button data-role="ph" onclick="setRole('ph')">摄影师端 · 接单赚钱</button>
</div>

<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sig">5G · 100%</span></div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<!-- 素材清单：供发布链路静态扫描并打包 （运行时由 JS 以同一相对路径动态引用） -->
<div style="display:none" aria-hidden="true">
<img src="portrait1.jpg" alt=""><img src="portrait2.jpg" alt=""><img src="portrait3.jpg" alt=""><img src="portrait4.jpg" alt=""><img src="travel1.jpg" alt=""><img src="travel2.jpg" alt=""><img src="travel3.jpg" alt="">
</div>

<script>
// ===== 演示数据 =====
const W = {p1:"portrait1.jpg",p2:"portrait2.jpg",p3:"portrait3.jpg",p4:"portrait4.jpg",t1:"travel1.jpg",t2:"travel2.jpg",t3:"travel3.jpg"};
const WORK_FEED = [
  {img:W.p1, t:"胶片质感写真", p:299, ph:"林一 · 认证"},
  {img:W.t1, t:"山野旅拍 · 泸沽湖", p:499, ph:"阿凯 · 旅拍"},
  {img:W.p3, t:"新中式写真", p:399, ph:"林一 · 认证"},
  {img:W.t2, t:"洱海树 · 意境旅拍", p:520, ph:"阿凯 · 旅拍"},
  {img:W.p4, t:"暖光情绪人像", p:349, ph:"陈默 · 认证"},
  {img:W.p2, t:"花园下午茶写真", p:329, ph:"小鹿 · 认证"},
];
const PHOTOGRAPHERS = [
  {n:"林一", tag:"认证摄影师", city:"上海", star:"4.9", n1:1280, works:286, style:"人像 / 写真 / 胶片", s:"6年全职，擅长情绪人像与胶片质感写真，多次获得平台优质创作者。"},
  {n:"阿凯", tag:"旅拍摄影师", city:"大理 · 丽江", star:"4.8", n1:980, works:312, style:"旅拍 / 风光 / 情侣", s:"常驻云南，专注旅行跟拍与情侣旅拍，边走边拍，出片快。"},
  {n:"陈默", tag:"认证摄影师", city:"北京", star:"4.9", n1:1560, works:401, style:"婚礼 / 活动 / 纪实", s:"婚礼跟拍 8 年，纪实风格，善捕捉自然瞬间。"},
  {n:"小鹿", tag:"认证摄影师", city:"杭州", star:"4.7", n1:760, works:198, style:"闺蜜照 / 探店 / 日常", s:"元气向摄影师，擅长闺蜜照、探店与日常记录。"},
];
const ORDERS = {
  all:[{img:W.p1,n:"林一 · 胶片写真",s:"待接单 · 已托管 ¥299",st:"待接单",b:"查看订单"},
       {img:W.t2,n:"阿凯 · 洱海旅拍",s:"待服务 · 已托管 ¥520",st:"待服务",b:"联系摄影师"},
       {img:W.p3,n:"林一 · 新中式写真",s:"已完成 · 已结算",st:"已完成",b:"去评价"}],
  pending:[{img:W.p1,n:"林一 · 胶片写真",s:"待接单 · 已托管 ¥299",st:"待接单",b:"查看订单"}],
  serving:[{img:W.t2,n:"阿凯 · 洱海旅拍",s:"待服务 · 已托管 ¥520",st:"待服务",b:"联系摄影师"}],
  done:[{img:W.p3,n:"林一 · 新中式写真",s:"已完成 · 已结算",st:"已完成",b:"去评价"}]
};

// ===== 路由 =====
let role = "user";

function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600);}
function tab(h,on,label){return `<button class="tab${on?' on':''}" onclick="go('${h}')"><span class="ic">${svg(h)}</span><span>${label}</span></button>`}

const ICONPATHS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h4v-6h6v6h4V9.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  orders:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M9 14h6"/>',
  message:'<path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 12h5"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4.5-6 8-6s7 2 8 6"/>',
  im:'<path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 12h5"/>',
  phome:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  pworks:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m3 16 5-4 4 3 3-3 6 5"/>',
  pincome:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9l3-2 3 2"/>',
  pdash:'<path d="M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z"/>',
  work:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  income:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9l3-2 3 2"/>',
  album:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m3 16 5-4 4 3 3-3 6 5"/>',
  dash:'<path d="M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4z"/>',
  back:'<path d="M15 5 8 12l7 7"/>',
  cam:'<circle cx="12" cy="13" r="4"/><path d="M4 7h4l2-3h4l2 3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>',
  star:'<path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1L12 17.8 6.5 20l1-6.1L3 9.5l6.3-.9z"/>'
};
function svg(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">${ICONPATHS[n]||ICONPATHS.cam}</svg>`}
function stars(v){let s='';for(let i=0;i<5;i++)s+=`<span style="color:${i<Math.round(v)?'var(--accent-2)':'#d8d0c4'}">★</span>`;return s}

// ===== 视图渲染 =====
function view_Login(){
  return `<div class="login" style="padding:0 26px; display:flex; flex-direction:column; justify-content:center; height:100%">
    <div style="font-size:40px;color:var(--accent);margin-bottom:8px">${svg('cam')}</div>
    <h1 style="font-size:28px;font-weight:800">一拍即合</h1>
    <p style="color:var(--muted);margin:8px 0 30px">让每个会拍照的人都能接单赚钱，<br>让每个想被好好记录的人都能放心约拍。</p>
    <button class="btn primary" onclick="role='user';go('home')" style="margin-bottom:12px">我是需求方 · 找摄影师拍照</button>
    <button class="btn ghost" onclick="role='ph';go('phome')">我是摄影师 · 入驻接单赚钱</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:26px">手机号验证码注册登录 · 微信授权</p>
  </div>`;
}

function view_Home(){
  const quick=[['写真','写'],['旅拍','旅'],['跟拍','跟'],['宠物','宠'],['婚礼','婚'],['探店','探'],['宝宝','宝'],['全部','∨']];
  const qq=quick.map(q=>`<div class="q" onclick="toast('已筛选：${q[0]}')"><div class="qic">${q[1]}</div>${q[0]}</div>`).join('');
  const works=WORK_FEED.map((w,i)=>`<div class="witem" onclick="go('ph',${i%PHOTOGRAPHERS.length})"><img src="${w.img}" alt=""><div class="wi"><span>${w.t}</span><div class="p">¥${w.p}<span style="color:var(--muted);font-weight:400;font-size:11px;margin-left:4px">${w.ph}</span></div></div></div>`).join('');
  const phs=PHOTOGRAPHERS.slice(0,3).map((p,i)=>phCard(p,i)).join('');

  login:view_Login, home:view_Home, search:view_Search, ph:view_Ph, pkg:view_Pkg,

  phome:view_Phome, pworks:view_Pworks, pincome:view_Pincome, pdash:view_Pdash
};
let lastTab='all';
function go(name,arg){
  const screen=document.getElementById('screen');
  if(name==='orders'&&typeof arg==='string'&&['all','pending','serving','done'].includes(arg)) lastTab=arg;
  let html;
  if(name==='orders') html=view_Orders(lastTab);
  else html=ROUTES[name](arg);
  let tb='';
  if(name==='home'||name==='search'||name==='orders'||name==='me') tb=tabbar('user',name);
  if(name==='phome'||name==='pworks'||name==='pincome'||name==='pdash') tb=tabbar('ph',name);
  screen.innerHTML=`<div class="view active">${html}</div>${tb}`;
}
function setRole(r){
  role=r;
  document.querySelectorAll('#roleToggle button').forEach(b=>b.classList.toggle('on',b.dataset.role===r));
  go(r==='user'?'home':'phome');
}
function boot(){
  if(!location.hash || location.hash==='#'){ go('login'); return; }
  const h=location.hash.slice(1); const [name,arg]=h.split('|');
  go(name,arg||undefined);
}
window.addEventListener('hashchange',boot);
window.addEventListener('DOMContentLoaded',boot);
